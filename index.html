<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12223F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="YYVOLT" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="YYVOLT is a toy F1 racing game set inside one kid's bedroom."
    />
    <title>YYVOLT</title>

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%2312223F'/%3E%3Cpath d='M13 2 4 14h6l-1 8 9-12h-6l1-8z' fill='%23FFC20E'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,600;1,700&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      The boot shell is intentionally inline: it must paint before any module
      or stylesheet is fetched. Game UI tokens move to theme.css in Phase 9.
    -->
    <style>
      :root {
        --navy: #12223f;
        --yellow: #ffc20e;
        --paper: #f4f6f8;
        --steel: #8a94a6;
        --kerb-red: #d7263d;

        --font-display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
        --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;

        color-scheme: dark;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--navy);
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        color: var(--paper);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        text-rendering: optimizeLegibility;
      }

      #scene {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      /* ---- Boot shell --------------------------------------------------- */

      .boot {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: clamp(20px, 4vh, 48px);
        padding:
          calc(clamp(22px, 3.4vw, 48px) + env(safe-area-inset-top, 0px))
          calc(clamp(22px, 3.4vw, 48px) + env(safe-area-inset-right, 0px))
          calc(clamp(22px, 3.4vw, 48px) + env(safe-area-inset-bottom, 0px))
          calc(clamp(22px, 3.4vw, 48px) + env(safe-area-inset-left, 0px));
        background: var(--navy);
        overflow: hidden;
        transition:
          opacity 420ms ease,
          visibility 0s linear 420ms;
      }

      .boot.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot__head {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .boot__wordmark {
        font-family: var(--font-display);
        font-style: italic;
        font-weight: 700;
        font-size: clamp(30px, 3.4vw, 44px);
        line-height: 0.9;
        letter-spacing: -0.015em;
      }

      .boot__mark {
        width: clamp(20px, 2.2vw, 26px);
        height: auto;
        fill: var(--yellow);
        flex: none;
      }

      .boot__watermark {
        position: absolute;
        top: 50%;
        right: -5vw;
        z-index: 0;
        width: min(54vw, 640px);
        height: auto;
        fill: var(--paper);
        opacity: 0.035;
        transform: translateY(-50%);
        pointer-events: none;
      }

      .boot__foot {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 12px;
        padding-top: clamp(16px, 2.4vw, 24px);
        border-top: 1px solid rgb(138 148 166 / 28%);
      }

      .boot__progress-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 24px;
      }

      .boot__label {
        margin: 0;
        font-size: 14px;
        line-height: 1.2;
      }

      .boot__percent {
        font-family: var(--font-display);
        font-style: italic;
        font-weight: 700;
        font-size: clamp(22px, 2.6vw, 32px);
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .boot__track {
        width: 100%;
        height: 2px;
        background: rgb(138 148 166 / 32%);
        overflow: hidden;
      }

      .boot__fill {
        width: 100%;
        height: 100%;
        background: var(--yellow);
        transform: scaleX(var(--progress, 0));
        transform-origin: left center;
        transition: transform 240ms linear;
      }

      .boot__detail {
        display: none;
        max-width: 62ch;
        margin: 0;
        color: var(--steel);
        font-size: 13px;
        line-height: 1.5;
      }

      .boot.is-error .boot__detail {
        display: block;
      }

      .boot.is-error .boot__fill {
        background: var(--kerb-red);
      }

      /* ---- Phase 7 boost speed lines ------------------------------------ */

      .speed-lines {
        position: fixed;
        inset: 0;
        z-index: 2;
        color: var(--paper);
        pointer-events: none;
        opacity: 0;
        transition: opacity 180ms ease-out;
      }

      .speed-lines.is-active {
        opacity: 0.55;
      }

      .speed-lines svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* ---- Phase 3 toast (Phase 9 moves this into the HUD styles) -------- */

      .toast {
        position: fixed;
        left: 50%;
        bottom: clamp(20px, 4vh, 42px);
        z-index: 5;
        max-width: min(86vw, 360px);
        padding: 10px 16px;
        background: var(--navy);
        border: 1px solid rgb(138 148 166 / 45%);
        border-left: 3px solid var(--yellow);
        border-radius: 2px;
        color: var(--paper);
        font-family: var(--font-body);
        font-size: 14px;
        line-height: 1.2;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, 8px);
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }

      .toast.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .noscript {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-content: center;
        padding: 32px;
        background: var(--navy);
        color: var(--paper);
        font-family: var(--font-body);
        text-align: center;
      }

      @media (max-width: 640px) {
        .boot__watermark {
          right: -18vw;
          width: 82vw;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot,
        .boot__fill,
        .speed-lines,
        .toast {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="YYVOLT 3D scene">
      Your browser cannot display the YYVOLT 3D scene.
    </canvas>

    <div id="boot" class="boot" role="status" aria-live="polite">
      <svg
        class="boot__watermark"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" />
      </svg>

      <header class="boot__head">
        <span class="boot__wordmark">YYVOLT</span>
        <svg class="boot__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" />
        </svg>
      </header>

      <footer class="boot__foot">
        <div class="boot__progress-row">
          <p id="boot-label" class="boot__label">Preparing the room</p>
          <span id="boot-percent" class="boot__percent">0%</span>
        </div>
        <div
          class="boot__track"
          role="progressbar"
          aria-labelledby="boot-label"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="boot-progress" class="boot__fill"></div>
        </div>
        <p id="boot-detail" class="boot__detail">
          This scene needs WebGL. Try a current browser with hardware acceleration
          enabled.
        </p>
      </footer>
    </div>

    <noscript>
      <div class="noscript">
        YYVOLT needs JavaScript to run. Enable it and reload this page.
      </div>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
